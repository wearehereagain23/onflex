<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnFlex Admin Portal</title>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0C290F" />

    <!-- For iOS PWA -->
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <style>
        body {
            background: radial-gradient(circle at center, #00071a, #000);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #24a0a0;
        }

        .loader {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid rgba(0, 204, 255, 0.3);
            animation: spin 4s linear infinite;
            box-shadow: 0 0 15px #003f40, inset 0 0 20px #00d5ff;
        }

        .loader::before,
        .loader::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 3px solid #00ccff;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        .loader::after {
            border-color: rgba(0, 229, 255, 0.5);
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            animation-delay: 1s;
        }

        .text {
            position: absolute;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 0 0 10px #00d0ff, 0 0 20px #00c8ff;
            animation: flicker 2s infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.5;
            }
        }

        @keyframes flicker {

            0%,
            19%,
            21%,
            23%,
            25%,
            54%,
            56%,
            100% {
                opacity: 1;
            }

            20%,
            24%,
            55% {
                opacity: 0.3;
            }
        }

        .swal2Style {
            color: #ffffff;
            border: 1px solid #00ccff44;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="loader"></div>
    <div class="text">OnFlex Admin</div>

    <script>
        let deferredPrompt = null;

        // Capture automated PWA install prompt event if supported by browser
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            showMobileInstallModal();
        });

        function handleDeviceRouting() {
            const ua = navigator.userAgent.toLowerCase();
            const isMobile = /iphone|ipad|ipod|android|blackberry|mini|windows\sce|palm/i.test(ua) || (window.innerWidth <= 768);

            if (isMobile) {
                // Check if already running as installed PWA app standalone window
                const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

                if (isPWA) {
                    window.location.href = "./login.html";
                    return;
                }

                // Show mandatory installation modal
                showMobileInstallModal();

            } else {
                // Desktop/PC Device -> Direct to Admin Login
                window.location.href = "./login.html";
            }
        }

        function showMobileInstallModal() {
            const hasInstallPrompt = deferredPrompt !== null;

            Swal.fire({
                title: "📲 Installation Required",
                html: `
                    <p style="font-size: 14px; color: #cbd5e1; margin-bottom: 12px;">
                        Mobile browser access is restricted. You must install the <b>OnFlex Admin App</b> on your device to continue.
                    </p>
                    <div style="text-align: left; font-size: 13px; color: #94a3b8; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; margin-top: 10px;">
                        📌 <b>Manual Installation Steps:</b><br>
                        1. Tap your browser menu (<b>⋮</b> or Share <span style="font-size:16px;">⎋</span>).<br>
                        2. Tap <b>"Add to Home Screen"</b> or <b>"Install App"</b>.<br>
                        3. Open the installed app from your home screen.
                    </div>
                `,
                icon: "warning",
                allowOutsideClick: false,
                allowEscapeKey: false,
                showConfirmButton: hasInstallPrompt,
                confirmButtonText: "Install App Now",
                confirmButtonColor: "#10b981",
                background: "#001a24",
                customClass: { popup: "swal2Style" }
            }).then((result) => {
                if (result.isConfirmed && deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(() => {
                        deferredPrompt = null;
                    });
                }
            });
        }

        window.addEventListener("DOMContentLoaded", handleDeviceRouting);
    </script>
</body>

</html>
