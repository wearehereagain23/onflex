<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />

    <!-- For iOS PWA -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <style>
        /* Loader & background */
        body {
            background: radial-gradient(circle at center, #00071a, #000);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            color: #24a0a0;
        }

        .loader {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid rgba(0, 204, 255, 0.3);
            animation: spin 4s linear infinite;
            box-shadow: 0 0 15px #003f40, inset 0 0 20px #00d5ff;
        }

        .loader::before,
        .loader::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 3px solid #00ccff;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        .loader::after {
            border-color: rgba(0, 229, 255, 0.5);
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            animation-delay: 1s;
        }

        .text {
            position: absolute;
            text-align: center;
            font-size: 1.5em;
            text-shadow: 0 0 10px #00d0ff, 0 0 20px #00c8ff;
            animation: flicker 2s infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.5;
            }
        }

        @keyframes flicker {

            0%,
            19%,
            21%,
            23%,
            25%,
            54%,
            56%,
            100% {
                opacity: 1;
            }

            20%,
            24%,
            55% {
                opacity: 0.3;
            }
        }

        /* SweetAlert custom styles */
        .swal2Style {
            color: white;
        }
    </style>
</head>

<body>
    <div class="loader"></div>
    <div class="text">OnFlex</div>

    <script>
        function handleRouting() {
            const ua = navigator.userAgent.toLowerCase();
            const isMobile = /iphone|ipad|ipod|android/i.test(ua);

            const urlParams = new URLSearchParams(window.location.search);
            const isRegistering = urlParams.has("i");

            if (isMobile) {
                // Show PWA installation instructions on mobile
                Swal.fire({
                    title: "📲 Install OnFlex",
                    html: `To continue, please install the app on your home screen or use your browser menu option to <b>Add to Home Screen / Install App</b>.`,
                    icon: "info",
                    allowOutsideClick: false,
                    showConfirmButton: false,
                    background: '#00313d',
                    customClass: { popup: 'swal2Style' }
                });
            } else {
                // Redirect on PC
                if (isRegistering) {
                    window.location.href = "register/index.html" + window.location.search;
                } else {
                    window.location.href = "login/index.html";
                }
            }
        }

        window.addEventListener("load", handleRouting);
    </script>
</body>

</html>
